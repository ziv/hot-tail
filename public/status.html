<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Hot Tail status</title>
    <style>
      :root {
        --bg: #0a1422;
        --panel: #101e30;
        --line: #1f3148;
        --text: #eaf6ff;
        --dim: #8fa6bd;
        --ok: #5ee6a0;
        --warn: #ffb020;
        --bad: #ff5a4a;
        --font: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 var(--font);
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 32px 16px 48px;
      }
      h1 {
        margin: 0 0 4px;
        font: italic 900 30px var(--font);
      }
      h1 span {
        color: #ff8a3a;
      }
      .sub {
        color: var(--dim);
        margin: 0 0 24px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 12px;
        margin-bottom: 24px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
      }
      .label {
        color: var(--dim);
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .value {
        font-size: 28px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 8px;
        vertical-align: middle;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      td,
      th {
        text-align: left;
        padding: 8px;
        border-top: 1px solid var(--line);
        font-size: 13px;
        vertical-align: top;
      }
      th {
        color: var(--dim);
        font-weight: 600;
      }
      td.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      code {
        font-size: 12px;
        word-break: break-word;
      }
      a {
        color: #7fe9ff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1><span>HOT</span> TAIL — status</h1>
      <p class="sub" id="updated">Checking…</p>
      <section class="grid" aria-label="Service health">
        <div class="card">
          <div class="label">Game</div>
          <div class="value"><span class="dot" style="background: var(--ok)"></span>Up</div>
        </div>
        <div class="card">
          <div class="label">API &amp; database</div>
          <div class="value" id="api">…</div>
        </div>
        <div class="card">
          <div class="label">Load time p50 / p95</div>
          <div class="value" id="load">–</div>
        </div>
        <div class="card">
          <div class="label">Errors (24 h)</div>
          <div class="value" id="errors">–</div>
        </div>
      </section>
      <section class="grid" aria-label="Leaderboard">
        <div class="card">
          <div class="label">Scores (24 h)</div>
          <div class="value" id="scores">–</div>
        </div>
        <div class="card">
          <div class="label">Replay verified</div>
          <div class="value" id="verified">–</div>
        </div>
        <div class="card">
          <div class="label">Rejected</div>
          <div class="value" id="rejected">–</div>
        </div>
        <div class="card">
          <div class="label">Awaiting check</div>
          <div class="value" id="pending">–</div>
        </div>
      </section>
      <section class="card" aria-label="Last 7 days">
        <div class="label">Last 7 days</div>
        <table id="week">
          <tbody></tbody>
        </table>
      </section>
      <section class="card" style="margin-top: 12px" aria-label="Recent errors">
        <div class="label">Recent client errors</div>
        <table>
          <thead>
            <tr>
              <th>Message</th>
              <th>Version</th>
              <th class="num">Count</th>
              <th>Last seen</th>
            </tr>
          </thead>
          <tbody id="errlist">
            <tr>
              <td colspan="4">–</td>
            </tr>
          </tbody>
        </table>
      </section>
      <p class="sub" style="margin-top: 20px">
        Aggregates only — no player data. <a href="./">Play Hot Tail</a>
      </p>
    </main>
    <script src="./status.js" defer></script>
  </body>
</html>
