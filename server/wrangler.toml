# Hot Tail API — Cloudflare Workers + D1 (J3, J8: backend config as code).
# Create the databases once:
#   wrangler d1 create hot-tail-staging && wrangler d1 create hot-tail
# then paste the database_id values below and apply migrations:
#   wrangler d1 migrations apply hot-tail-staging --env staging --remote
name = "hot-tail-api"
main = "src/worker.ts"
compatibility_date = "2026-09-01"

# Replay validation (J4) runs off the request path, a few scores per minute.
[triggers]
crons = ["* * * * *"]

# Re-simulating a full run is CPU-heavy (seconds); needs the Workers Paid plan limit.
[limits]
cpu_ms = 30000

[vars]
ALLOWED_ORIGIN = "http://localhost:5173,http://localhost:4173"

[[d1_databases]]
binding = "DB"
database_name = "hot-tail-dev"
database_id = "local"
migrations_dir = "migrations"

[env.staging]
name = "hot-tail-api-staging"
vars = { ALLOWED_ORIGIN = "*" }
d1_databases = [{ binding = "DB", database_name = "hot-tail-staging", database_id = "REPLACE_ME", migrations_dir = "migrations" }]

[env.production]
name = "hot-tail-api"
vars = { ALLOWED_ORIGIN = "https://hottail.example" }
d1_databases = [{ binding = "DB", database_name = "hot-tail", database_id = "REPLACE_ME", migrations_dir = "migrations" }]

# Secret (per environment): wrangler secret put IP_SALT --env production
